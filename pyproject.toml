[project]
name = "universal-swarms"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "msb1", email = "44041613+msb1@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "fastmcp>=4.2.4",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "psycopg[binary]>=3.3.9",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
universal-swarms = "universal_swarms:main"
universal-swarms-mcp = "universal_swarms.mcp_server:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
]
